<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="ShopEase online store">
	<title>ShopEase | Online Store</title>
	<style>
		:root {
			color-scheme: light;
			font-family: "Trebuchet MS", "Segoe UI", sans-serif;
			color: #17201d;
			background: #f7f7f2;
		}

		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			grid-template-rows: auto 1fr auto;
		}

		header, footer {
			padding: 1.25rem clamp(1.25rem, 6vw, 5rem);
		}

		header { border-bottom: 1px solid #dedfd7; }

		.brand {
			color: inherit;
			font-size: 1.2rem;
			font-weight: 800;
			text-decoration: none;
		}

		.brand span { color: #db5d36; }

		main {
			display: grid;
			align-content: center;
			justify-items: start;
			width: min(100% - 2.5rem, 920px);
			margin: 0 auto;
			padding: 5rem 0;
		}

		.eyebrow {
			margin: 0 0 1rem;
			color: #a34428;
			font-size: .8rem;
			font-weight: 800;
			letter-spacing: .12em;
			text-transform: uppercase;
		}

		h1 {
			max-width: 700px;
			margin: 0;
			font-size: clamp(2.8rem, 8vw, 5.5rem);
			line-height: .98;
		}

		.intro {
			max-width: 540px;
			margin: 1.5rem 0 2rem;
			color: #515a55;
			font-size: 1.15rem;
			line-height: 1.65;
		}

		.store-link {
			display: inline-flex;
			min-height: 3.25rem;
			align-items: center;
			padding: 0 1.5rem;
			border-radius: 4px;
			background: #db5d36;
			color: white;
			font-weight: 700;
			text-decoration: none;
		}

		.store-link:hover, .store-link:focus-visible { background: #a34428; }

		footer {
			border-top: 1px solid #dedfd7;
			color: #68716b;
			font-size: .9rem;
		}

		@media (max-width: 480px) {
			main { padding: 3.5rem 0; }
			h1 { font-size: 3rem; }
		}
	</style>
</head>
<body>
	<header>
		<a class="brand" href="./">Shop<span>Ease</span></a>
	</header>
	<main>
		<p class="eyebrow">Everyday finds, made easy</p>
		<h1>Shop smart.<br>Live better.</h1>
		<p class="intro">ShopEase is a static project preview hosted on GitHub Pages. Browse the source on GitHub; accounts, cart, and checkout need a server.</p>
		<a class="store-link" href="https://github.com/sabarish-077/ShopEase_ECommerce">View ShopEase on GitHub</a>
	</main>
	<footer>ShopEase Online Store</footer>
</body>
</html>
