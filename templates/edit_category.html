{% extends "base.html" %}

{% block title %}Edit Category | ShopEase{% endblock %}

{% block content %}

<style>
    .category-container {
        min-height: 70vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 50px 20px;
    }

    .category-card {
        width: 100%;
        max-width: 600px;
        background: #fff;
        padding: 40px;
        border-radius: 18px;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
    }

    .category-card h1 {
        margin-bottom: 8px;
        color: #111;
    }

    .category-card > p {
        color: #777;
        margin-bottom: 30px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: 600;
        color: #222;
    }

    .form-group input,
    .form-group textarea {
        width: 100%;
        padding: 13px;
        border: 1px solid #ddd;
        border-radius: 8px;
        box-sizing: border-box;
        font-size: 14px;
        outline: none;
    }

    .form-group input:focus,
    .form-group textarea:focus {
        border-color: #111;
    }

    .form-group textarea {
        min-height: 130px;
        resize: vertical;
    }

    .update-btn {
        width: 100%;
        padding: 14px;
        background: #111;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
    }

    .update-btn:hover {
        background: #333;
    }

    .back-btn {
        display: block;
        margin-top: 18px;
        text-align: center;
        color: #555;
        text-decoration: none;
        font-size: 14px;
    }

    .back-btn:hover {
        color: #111;
    }

    .message {
        padding: 12px;
        margin-bottom: 18px;
        border-radius: 8px;
        background: #fee2e2;
        color: #991b1b;
        font-size: 13px;
    }

    @media (max-width: 600px) {
        .category-card {
            padding: 28px 20px;
        }
    }
</style>

<div class="category-container">

    <div class="category-card">

        <h1>Edit Category</h1>

        <p>Update your category information.</p>

        {% if messages %}
            {% for message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>Category Name</label>

                <input
                    type="text"
                    name="name"
                    value="{{ category.name }}"
                    required
                >

            </div>

            <div class="form-group">

                <label>Description</label>

                <textarea
                    name="description"
                >{{ category.description }}</textarea>

            </div>

            <button
                type="submit"
                class="update-btn"
            >
                Update Category
            </button>

        </form>

        <a
            href="{% url 'admin_dashboard' %}"
            class="back-btn"
        >
            ← Back to Admin Dashboard
        </a>

    </div>

</div>

{% endblock %}
