<!DOCTYPE html>
<html>
<head>
    <title>Add Product - ShopEase</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.10);
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #111;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            background: #e8f7e8;
            color: #176b17;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #111;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Add Product</h1>
    <p class="subtitle">Add a new product to your ShopEase store.</p>

    {% if messages %}
        {% for message in messages %}
            <div class="message">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        <label>Category</label>

        <select name="category" required>
            <option value="">Select Category</option>

            {% for category in categories %}
                <option value="{{ category.id }}">
                    {{ category.name }}
                </option>
            {% endfor %}
        </select>

        <label>Product Name</label>

        <input
            type="text"
            name="name"
            placeholder="Enter product name"
            required
        >

        <label>Description</label>

        <textarea
            name="description"
            placeholder="Enter product description"
            required
        ></textarea>

        <label>Price</label>

        <input
            type="number"
            name="price"
            step="0.01"
            min="0"
            placeholder="Enter price"
            required
        >

        <label>Stock</label>

        <input
            type="number"
            name="stock"
            min="0"
            placeholder="Enter stock quantity"
            required
        >

        <label>Product Image</label>

        <input
            type="file"
            name="image"
            accept="image/*"
        >

        <button type="submit">
            Add Product
        </button>

    </form>

    <a href="{% url 'admin_dashboard' %}" class="back">
        ← Back to Admin Dashboard
    </a>

</div>

</body>
</html>
